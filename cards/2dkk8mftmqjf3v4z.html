<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>❤ 安安 給 媽媽 的心願小卡</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#FAF0FC;font-family:"Noto Sans TC",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:16px}.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.pt{position:absolute;opacity:.13;animation:fall linear infinite}@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:.13}90%{opacity:.07}100%{transform:translateY(105vh) rotate(300deg);opacity:0}}.card{position:relative;z-index:1;background:#fff;border-radius:24px;max-width:480px;width:100%;box-shadow:0 16px 56px rgba(0,0,0,.15);overflow:hidden}.ct{background:linear-gradient(145deg,#5A2060,#8A4090,#C060B0);padding:32px 28px 24px;position:relative;overflow:hidden}.ct::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}.ftag{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:2px;margin-bottom:8px}.theme-name{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px;margin-bottom:4px}.toname{font-family:"Noto Serif TC",serif;font-size:28px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:4px}.fromname{font-size:13px;color:rgba(255,255,255,.75)}.cb{padding:24px 28px 28px;background:#FAF0FC}.msgbox{background:#F4E0F8;border-radius:14px;padding:18px 20px;margin-bottom:20px;border-left:3px solid #9A50A0}.msgtxt{font-size:16px;color:#2d1f28;line-height:1.95;white-space:pre-wrap;font-family:"Noto Serif TC",serif}.audio-section{background:linear-gradient(135deg,#ECC8F4,#E0B8EC);border-radius:14px;padding:16px 18px;margin-bottom:16px}.audio-label{font-size:12px;color:#6A2870;font-weight:700;letter-spacing:1px;margin-bottom:6px}.drow{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid #D090E0;flex-wrap:wrap;gap:8px}.dtxt{font-size:11px;color:#8a6f78;line-height:1.7}.sbtn{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(145deg,#5A2060,#8A4090,#C060B0);color:#fff;padding:8px 18px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:"Noto Sans TC",sans-serif;transition:all .2s}.sbtn:hover{transform:translateY(-1px)}.fn{text-align:center;font-size:11px;color:#8a6f78;line-height:1.8;position:relative;z-index:1}</style></head><body><div class="bg" id="bg"></div><div class="card"><div class="ct"><div class="theme-name">✦ 浪漫玫紫　智慧專屬設計</div><div class="ftag">💮 心願小卡</div><div class="toname">親愛的<br>媽媽</div><div class="fromname">來自 安安 的心意 ❤</div></div><div class="cb"><div class="msgbox"><div class="msgtxt">媽媽我愛你</div></div><div class="drow"><div class="dtxt">🕊 2026年6月18日<br>臺北榮民總醫院蘇澳暨員山分院</div><button class="sbtn" onclick="savePage()">📥 下載儲存</button></div></div></div><div class="fn">善終是每個人的權利　❤<br>臺北榮民總醫院蘇澳暨員山分院</div><script>(function(){var e=["💜","🌺","💐","🫶"],b=document.getElementById("bg");for(var i=0;i<12;i++){var p=document.createElement("div");p.className="pt";p.textContent=e[i%e.length];p.style.cssText="left:"+Math.random()*100+"vw;font-size:"+(14+Math.random()*14)+"px;animation-duration:"+(14+Math.random()*16)+"s;animation-delay:"+(-Math.random()*20)+"s";b.appendChild(p);}})();function savePage(){var a=document.createElement("a");a.href="data:text/html;charset=utf-8,"+encodeURIComponent(document.documentElement.outerHTML);a.download="心願小卡_媽媽.html";a.click();}</script></body></html>
