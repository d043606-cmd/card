<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>❖ 安安 給 爸爸 的心願小卡</title><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#F0F8F8;font-family:"Noto Sans TC",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;flex-direction:column;gap:16px}.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.pt{position:absolute;opacity:.13;animation:fall linear infinite}@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:.13}90%{opacity:.07}100%{transform:translateY(105vh) rotate(300deg);opacity:0}}.card{position:relative;z-index:1;background:#fff;border-radius:24px;max-width:480px;width:100%;box-shadow:0 16px 56px rgba(0,0,0,.15);overflow:hidden}.ct{background:linear-gradient(145deg,#1A4A50,#2E6B70,#3E8A8E);padding:32px 28px 24px;position:relative;overflow:hidden}.ct::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}.ftag{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:2px;margin-bottom:8px}.theme-name{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:1px;margin-bottom:4px}.toname{font-family:"Noto Serif TC",serif;font-size:28px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:4px}.fromname{font-size:13px;color:rgba(255,255,255,.75)}.cb{padding:24px 28px 28px;background:#F0F8F8}.msgbox{background:#E0F2F4;border-radius:14px;padding:18px 20px;margin-bottom:20px;border-left:3px solid #2E6B70}.msgtxt{font-size:16px;color:#2d1f28;line-height:1.95;white-space:pre-wrap;font-family:"Noto Serif TC",serif}.audio-section{background:linear-gradient(135deg,#C0E4E8,#A8D4D8);border-radius:14px;padding:16px 18px;margin-bottom:16px}.audio-label{font-size:12px;color:#1A4A50;font-weight:700;letter-spacing:1px;margin-bottom:6px}.drow{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:1px solid #80C4C8;flex-wrap:wrap;gap:8px}.dtxt{font-size:11px;color:#8a6f78;line-height:1.7}.sbtn{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(145deg,#1A4A50,#2E6B70,#3E8A8E);color:#fff;padding:8px 18px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;border:none;font-family:"Noto Sans TC",sans-serif;transition:all .2s}.sbtn:hover{transform:translateY(-1px)}.sbtn2{display:inline-flex;align-items:center;gap:5px;background:transparent;color:linear-gradient(145deg,#1A4A50,#2E6B70,#3E8A8E);padding:8px 18px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid linear-gradient(145deg,#1A4A50,#2E6B70,#3E8A8E);font-family:"Noto Sans TC",sans-serif;transition:all .2s}.sbtn2:hover{transform:translateY(-1px)}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.fn{text-align:center;font-size:11px;color:#8a6f78;line-height:1.8;position:relative;z-index:1}</style></head><body><div class="bg" id="bg"></div><div class="card"><div class="ct"><div class="theme-name">✦ 穩重深青　智慧專屬設計</div><div class="ftag">💮 心願小卡</div><div class="toname">親愛的<br>爸爸</div><div class="fromname">來自 安安 的心意 ❖</div></div><div class="cb"><div class="msgbox"><div class="msgtxt">爸爸我愛你</div></div><div class="drow"><div class="dtxt">🕊 2026年6月22日<br>臺北榮民總醫院蘇澳暨員山分院</div><div class="btnrow"><button class="sbtn" onclick="savePage()">📥 下載儲存</button><button class="sbtn2" onclick="saveAsImage()">🖼 存成圖片</button></div></div></div></div><div class="fn">善終是每個人的權利　❖<br>臺北榮民總醫院蘇澳暨員山分院</div><script>(function(){var e=["🕊","🌊","💠","🔷"],b=document.getElementById("bg");for(var i=0;i<12;i++){var p=document.createElement("div");p.className="pt";p.textContent=e[i%e.length];p.style.cssText="left:"+Math.random()*100+"vw;font-size:"+(14+Math.random()*14)+"px;animation-duration:"+(14+Math.random()*16)+"s;animation-delay:"+(-Math.random()*20)+"s";b.appendChild(p);}})();function savePage(){var a=document.createElement("a");a.href="data:text/html;charset=utf-8,"+encodeURIComponent(document.documentElement.outerHTML);a.download="心願小卡_爸爸.html";a.click();}var hasAudio=false;function saveAsImage(){if(hasAudio){ if(!confirm("⚠️ 圖片不會包含語音內容，對方收到圖片將聽不到錄音。\n是否仍要存成圖片？")) return; }var card=document.querySelector(".card");html2canvas(card,{useCORS:true,backgroundColor:null,scale:2}).then(function(canvas){var a=document.createElement("a");a.download="心願小卡_爸爸.png";a.href=canvas.toDataURL("image/png");a.click();}).catch(function(){ alert("存成圖片失敗，請改用「下載儲存」"); });}</script></body></html>
